volumes:
  postgres_data:
  static_value:
  media_value:
  frontend_static:

services:
  db:
    image: postgres:16-alpine
    container_name: foodgram-db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    restart: always

  backend:
    image: sibnum/foodgram_backend:latest
    container_name: foodgram_backend
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
    depends_on:
      - db
    env_file:
      - .env
    restart: always

  frontend:
    image: sibnum/foodgram_frontend:latest
    container_name: foodgram_frontend
    volumes:
      - frontend_static:/app/build
    env_file:
      - .env
    depends_on:
      - backend
    restart: always

  gateway:
    image: sibnum/foodgram_gateway:latest
    container_name: foodgram-gateway
    ports:
      - "80:80"
    volumes:
      - ./docs/:/usr/share/nginx/html/api/docs/
      - static_value:/var/html/static/
      - media_value:/var/html/media/
      - frontend_static:/usr/share/nginx/html
    depends_on:
      - backend
      - frontend
    restart: always
